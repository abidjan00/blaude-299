[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blaude"
version = "0.1.0"
description = "A small language model built for Course 299"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "tokenizers>=0.21,<0.23"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
model = ["torch==2.9.0"]

[tool.setuptools.packages.find]
include = ["blaude*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
